[package]
name = "sap-interfaces"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"
test = false
bench = false

[features]
# Schemas with interfaces, whose generated code needs a heap.
alloc = ["capnp/alloc"]

[dependencies]
capnp = { version = "0.27.2", default-features = false }

[build-dependencies]
capnp = "0.27.2"
capnpc = "0.27.0"
