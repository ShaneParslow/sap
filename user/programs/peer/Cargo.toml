[package]
name = "peer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "peer"
path = "main.rs"
test = false
bench = false

[dependencies]
# No heap: the peer doesn't allocate.
sap-rt = { path = "../../lib/rt", default-features = false }
capnp = { version = "0.27.2", default-features = false }
sap-interfaces = { path = "../../lib/interfaces" }
sap-ring = { path = "../../lib/ring" }
