[package]
name = "init"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "init"
path = "main.rs"
test = false
bench = false

[dependencies]
blake3 = { version = "1.8.7", default-features = false }
capnp = { version = "0.27.2", default-features = false }
sap-interfaces = { path = "../../lib/interfaces" }
sap-rt = { path = "../../lib/rt" }
sap-process = { path = "../../lib/process" }
sap-loader = { path = "../../lib/loader" }
sap-ring = { path = "../../lib/ring" }

[build-dependencies]
blake3 = "1.8.7"
capnpc = "0.27.0"
sap-manifests = { path = "../../../tools/manifests" }
