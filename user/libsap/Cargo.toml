[package]
name = "libsap"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"
# No test harness on a bare-metal target.
test = false
bench = false

[features]
default = ["heap"]
# A heap behind `alloc` (the global allocator). Without it, a program that
# uses `alloc` fails to link.
heap = ["dep:linked_list_allocator"]

[dependencies]
# The heap's free list; without its spinlock, since libsap has its own lock.
linked_list_allocator = { version = "0.10.6", default-features = false, optional = true }
sap-sys = { path = "../sys" }
