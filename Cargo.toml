# Every crate in one workspace: one lockfile, one set of profiles, and one
# project for rust-analyzer. `cargo build` and `cargo run` here (or in
# kernel/) build and boot the kernel, whose build script builds and embeds
# the user programs. Building the user crates directly (`--workspace`) is
# fine for checking, but their images only link correctly from user/, where
# user/.cargo/config.toml makes them position-independent.
[workspace]
resolver = "3"
members = ["abi", "kernel", "user/lib/sys", "user/lib/rt", "user/lib/ring", "user/lib/loader", "user/lib/process", "user/lib/interfaces", "user/programs/init", "user/programs/check", "user/programs/test-kernel", "user/programs/peer", "user/programs/log", "user/programs/memory", "user/programs/resolver", "user/programs/counter", "user/programs/composer"]
default-members = ["kernel"]
# Host-only crates for build scripts: never built for the bare-metal target.
exclude = ["tools/manifests"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# For the kernel's audit (kernel/audit.rs): optimized, so auditing on every
# return to user mode stays quick, but keeping debug assertions and overflow
# checks. `cargo run --profile audit --features audit`.
[profile.audit]
inherits = "dev"
opt-level = 2

# Cap'n Proto's code generator with `no_rpc` (user/lib/interfaces/build.rs),
# from a fork until upstream has it; then back to crates.io's.
[patch.crates-io]
capnpc = { git = "https://github.com/ShaneParslow/capnproto-rust", rev = "0800c3be27245a6ef893a5b6833249bcafc8af89" }
