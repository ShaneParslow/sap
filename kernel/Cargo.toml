[package]
name = "sap-kernel"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sap-kernel"
path = "main.rs"
test = false
bench = false

[dependencies]
bitflags = "2"
elf = { version = "0.8.0", default-features = false }
# 0.2 is in alpha with a different API; stay on the stable line.
fdt = "=0.1.5"
riscv = { version = "0.16.1", default-features = false }
sap-abi = { version = "0.1.0", path = "../abi" }
sbi-rt = { version = "0.0.4", features = ["legacy"] }
