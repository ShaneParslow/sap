[package]
name = "sap-kernel"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sap-kernel"
path = "main.rs"
test = false
bench = false

[dependencies]
bitflags = "2"
elf = { version = "0.8.0", default-features = false }
# 0.2 is in alpha with a different API; stay on the stable line.
fdt = "=0.1.5"
riscv = { version = "0.16.1", default-features = false }
sap-abi = { version = "0.1.0", path = "../abi" }
sbi-rt = { version = "0.0.4", features = ["legacy"] }

[features]
# CHERI-RISC-V (the RVY draft): save user capabilities whole across traps.
# Needs firmware that turns CHERI on (menvcfg.Y), such as the OpenSBI
# built by toolchain/build.sh on the cheri branch.
cheri = []
# The audit (audit.rs): check the kernel's own data structures before every
# return to user mode, and panic at the first broken invariant. For tests.
audit = []
